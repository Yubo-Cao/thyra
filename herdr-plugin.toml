id = "thyra"
name = "Thyra"
version = "0.9.0"
min_herdr_version = "0.7.2"
description = "Web and PWA client for Herdr: workspaces, tabs, panes, agent status, session inspection, files, and diffs"
platforms = ["linux", "macos", "windows"]

# Thin launcher: every action delegates to scripts/thyra-plugin.ts, which
# downloads the checksum-verified prebuilt release binary matching this
# checkout's version on demand and forwards service verbs to it (systemd,
# launchd, or Windows Task Scheduler). The verb set is a frozen contract; see
# scripts/thyra-plugin.ts. The shim itself runs on Bun. For an unreleased
# checkout, run `bun scripts/thyra-plugin.ts build-source`, then
# `herdr plugin link .`; see docs/DEPLOYMENT.md#herdr-plugin.
# The panel opens as a session-modal popup in the Herdr TUI by default. Open
# it with --placement split (or tab/zoomed/overlay) to get a regular pane
# that other Herdr clients, including Thyra itself, can see.

[[build]]
command = ["bun", "scripts/thyra-plugin.ts", "build"]

[[panes]]
id = "panel"
title = "Thyra"
placement = "popup"
width = "72%"
height = 12
command = ["bun", "scripts/thyra-plugin.ts", "panel"]

[[actions]]
id = "start"
title = "Start Thyra"
contexts = ["workspace"]
command = ["bun", "scripts/thyra-plugin.ts", "start"]

[[actions]]
id = "restart"
title = "Restart Thyra"
contexts = ["workspace"]
command = ["bun", "scripts/thyra-plugin.ts", "restart"]

[[actions]]
id = "status"
title = "Thyra status"
contexts = ["workspace"]
command = ["bun", "scripts/thyra-plugin.ts", "status"]

[[actions]]
id = "url"
title = "Show Thyra URL"
contexts = ["workspace"]
command = ["bun", "scripts/thyra-plugin.ts", "url"]

[[actions]]
id = "version"
title = "Show Thyra version"
contexts = ["workspace"]
command = ["bun", "scripts/thyra-plugin.ts", "version"]

[[actions]]
id = "uninstall"
title = "Uninstall Thyra service"
contexts = ["workspace"]
command = ["bun", "scripts/thyra-plugin.ts", "uninstall"]
